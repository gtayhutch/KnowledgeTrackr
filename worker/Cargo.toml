[package]
name = "knowledgetrackr-worker"
version = "0.1.0"
edition = "2021"
publish = false
description = "HTTP API for the KnowledgeTrackr knowledge base."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.9", features = ["d1"] }
wasm-bindgen = "0.2"

[dev-dependencies]
rand = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
